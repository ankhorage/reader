name: Bootstrap Devtools
on:
  push:
    branches:
      - feat/1-reader-bootstrap
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install package dependencies
        run: bun install
      - name: Run canonical Ankhorage Devtools sync
        run: bunx @ankhorage/ankh devtools sync .
      - name: Commit generated Devtools files to the implementation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(devtools): sync canonical repository tooling [skip ci]"
            git push origin HEAD:feat/1-reader-bootstrap
          fi
